<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchIt — Instagram 热门视频搬运工作台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="row top-row">
      <h1>🎬 CatchIt</h1>
      <nav id="nav">
        <button data-view="discover" class="active">发现 <span id="cnt-discover" class="badge">0</span></button>
        <button data-view="library">素材库 <span id="cnt-library" class="badge">0</span></button>
        <button data-view="failed">失败 <span id="cnt-failed" class="badge">0</span></button>
        <button data-view="settings">设置</button>
      </nav>
      <span id="login-indicator" class="login-indicator">…</span>
    </div>
    <div class="row action-row">
      <div class="paste-box">
        <input id="url-input" type="text"
               placeholder="粘贴 Instagram 视频链接（可一次多条），回车直接下载入库">
        <button id="btn-add-urls" class="primary">解析下载</button>
      </div>
      <div class="scrape-box">
        <select id="scrape-channel"></select>
        <button id="btn-scrape" class="primary">🔍 抓取热门</button>
      </div>
    </div>
    <div id="task-bar" class="task-bar hidden">
      <span id="task-msg"></span>
      <button id="btn-cancel" class="ghost">取消</button>
    </div>
    <div id="toast" class="toast hidden"></div>
  </header>

  <main id="view"></main>

  <script src="/static/app.js"></script>
</body>
</html>
